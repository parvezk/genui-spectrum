<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly revenue 2024</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #111827; background: #f9fafb; }
  h1 { font-size: 18px; margin: 0 0 10px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .stat { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 8px 10px; }
  .stat small { display: block; font-size: 11px; color: #6b7280; }
  .stat b { font-size: 17px; }
  .stat.best b { color: #047857; } .stat.worst b { color: #b91c1c; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .seg { display: flex; border: 1px solid #d1d5db; border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; color: inherit; }
  .seg button.on { background: #111827; color: #fff; }
  label.tog { font-size: 12px; display: flex; gap: 4px; align-items: center; cursor: pointer; }
  svg { width: 100%; height: auto; display: block; }
  .axis { font-size: 9px; fill: #6b7280; }
  .val { font-size: 9px; fill: #374151; text-anchor: middle; font-weight: 600; }
  .b { fill: #93c5fd; cursor: pointer; transition: opacity .15s; }
  .b.best { fill: #059669; } .b.worst { fill: #dc2626; }
  .b.dim { opacity: .45; }
  .b.sel { stroke: #111827; stroke-width: 1.5; }
  .detail { min-height: 62px; }
  .detail h2 { margin: 0 0 2px; font-size: 15px; }
  .detail p { margin: 0; color: #4b5563; font-size: 13px; }
  .up { color: #047857; font-weight: 600; } .down { color: #b91c1c; font-weight: 600; }
  .legend { display: flex; gap: 12px; font-size: 11px; color: #6b7280; margin-top: 4px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 3px; }
</style>
</head>
<body>
  <h1>Monthly revenue, 2024</h1>

  <div class="stats">
    <div class="stat best"><small>Best month</small><b>Dec · $80k</b></div>
    <div class="stat worst"><small>Worst month</small><b>Feb · $38k</b></div>
    <div class="stat"><small>Total</small><b>$683k</b></div>
    <div class="stat"><small>Monthly average</small><b>$56.9k</b></div>
  </div>

  <div class="card">
    <div class="bar">
      <div class="seg" id="view"><button data-view="month" class="on">Months</button><button data-view="quarter">Quarters</button></div>
      <label class="tog"><input type="checkbox" id="avg" checked> Average line</label>
    </div>
    <svg id="chart" viewBox="0 0 340 200" role="img" aria-label="Bar chart of revenue">
      <line x1="30" y1="170" x2="334" y2="170" stroke="#d1d5db"/>
      <g id="grid"></g>
      <g id="bars"></g>
      <line id="avgLine" x1="30" x2="334" stroke="#111827" stroke-dasharray="4 3"/>
      <text id="avgText" class="axis" x="334" text-anchor="end"></text>
    </svg>
    <div class="legend"><span><i style="background:#059669"></i>Best</span><span><i style="background:#dc2626"></i>Worst</span><span><i style="background:#93c5fd"></i>Other</span><span>Hover or tap a bar</span></div>
  </div>

  <div class="card detail" id="detail"></div>

<script>
(function () {
  var months = [['Jan', 42], ['Feb', 38], ['Mar', 51], ['Apr', 47], ['May', 55], ['Jun', 61], ['Jul', 58], ['Aug', 49], ['Sep', 63], ['Oct', 67], ['Nov', 72], ['Dec', 80]];
  var SVG = 'http://www.w3.org/2000/svg';
  var $ = function (id) { return document.getElementById(id); };
  var view = 'month';
  var selected = 11;
  var hover = -1;
  var total = months.reduce(function (s, m) { return s + m[1]; }, 0);

  function series() {
    if (view === 'month') { return months.map(function (m) { return { label: m[0], value: m[1] }; }); }
    var out = [];
    for (var q = 0; q < 4; q++) {
      out.push({ label: 'Q' + (q + 1), value: months[q * 3][1] + months[q * 3 + 1][1] + months[q * 3 + 2][1] });
    }
    return out;
  }

  function node(tag, attrs, text) {
    var n = document.createElementNS(SVG, tag);
    for (var k in attrs) { if (Object.prototype.hasOwnProperty.call(attrs, k)) { n.setAttribute(k, attrs[k]); } }
    if (text !== undefined) { n.textContent = text; }
    return n;
  }

  function render() {
    var s = series();
    var values = s.map(function (d) { return d.value; });
    var max = Math.max.apply(null, values);
    var min = Math.min.apply(null, values);
    var mean = total / s.length;
    var top = 16, bottom = 170, left = 30, right = 334;
    var yMax = Math.ceil(max * 1.1 / 10) * 10;
    var py = function (v) { return bottom - (bottom - top) * (v / yMax); };
    var slot = (right - left) / s.length;
    var active = hover !== -1 ? hover : selected;

    var grid = $('grid');
    while (grid.firstChild) { grid.removeChild(grid.firstChild); }
    [0, yMax / 2, yMax].forEach(function (v) {
      grid.appendChild(node('text', { 'class': 'axis', x: 26, y: py(v) + 3, 'text-anchor': 'end' }, '$' + Math.round(v) + 'k'));
      if (v > 0) { grid.appendChild(node('line', { x1: left, x2: right, y1: py(v), y2: py(v), stroke: '#f3f4f6' })); }
    });

    var bars = $('bars');
    while (bars.firstChild) { bars.removeChild(bars.firstChild); }
    s.forEach(function (d, i) {
      var cls = 'b' + (d.value === max ? ' best' : (d.value === min ? ' worst' : ''));
      if (active !== -1 && i !== active) { cls += ' dim'; }
      if (i === selected) { cls += ' sel'; }
      var x = left + i * slot + slot * 0.14;
      var w = slot * 0.72;
      bars.appendChild(node('rect', { 'class': cls, 'data-i': i, x: x.toFixed(1), y: py(d.value).toFixed(1), width: w.toFixed(1), height: (bottom - py(d.value)).toFixed(1), rx: 2 }));
      bars.appendChild(node('text', { 'class': 'val', x: (x + w / 2).toFixed(1), y: (py(d.value) - 3).toFixed(1) }, String(d.value)));
      bars.appendChild(node('text', { 'class': 'axis', x: (x + w / 2).toFixed(1), y: 183, 'text-anchor': 'middle' }, d.label));
    });

    var showAvg = $('avg').checked;
    $('avgLine').style.display = showAvg ? '' : 'none';
    $('avgText').style.display = showAvg ? '' : 'none';
    $('avgLine').setAttribute('y1', py(mean).toFixed(1));
    $('avgLine').setAttribute('y2', py(mean).toFixed(1));
    $('avgText').setAttribute('y', (py(mean) - 3).toFixed(1));
    $('avgText').textContent = 'avg $' + mean.toFixed(1) + 'k';

    var box = $('detail');
    box.textContent = '';
    var d = s[active];
    var h = document.createElement('h2');
    h.textContent = d.label + ': $' + d.value + 'k' + (d.value === max ? ' (best)' : (d.value === min ? ' (worst)' : ''));
    box.appendChild(h);
    var p1 = document.createElement('p');
    if (active === 0) { p1.textContent = 'First ' + view + ' of the year.'; }
    else {
      var prev = s[active - 1];
      var diff = d.value - prev.value;
      var span = document.createElement('span');
      span.className = diff >= 0 ? 'up' : 'down';
      span.textContent = (diff >= 0 ? '+' : '−') + '$' + Math.abs(diff) + 'k (' + (diff >= 0 ? '+' : '−') + Math.abs(diff / prev.value * 100).toFixed(1) + '%)';
      p1.appendChild(span);
      p1.appendChild(document.createTextNode(' vs ' + prev.label));
    }
    box.appendChild(p1);
    var p2 = document.createElement('p');
    var vsAvg = d.value - mean;
    p2.textContent = (d.value / total * 100).toFixed(1) + '% of the year · ' + (vsAvg >= 0 ? '$' + vsAvg.toFixed(1) + 'k above' : '$' + Math.abs(vsAvg).toFixed(1) + 'k below') + ' average';
    box.appendChild(p2);
  }

  $('view').addEventListener('click', function (e) {
    var v = e.target.getAttribute('data-view');
    if (!v || v === view) { return; }
    view = v;
    selected = v === 'month' ? 11 : 3;
    hover = -1;
    var buttons = $('view').children;
    for (var i = 0; i < buttons.length; i++) { buttons[i].className = buttons[i].getAttribute('data-view') === v ? 'on' : ''; }
    render();
  });
  $('avg').addEventListener('change', render);
  $('bars').addEventListener('click', function (e) {
    var i = e.target.getAttribute('data-i');
    if (i === null) { return; }
    selected = parseInt(i, 10);
    render();
  });
  $('bars').addEventListener('mouseover', function (e) {
    var i = e.target.getAttribute('data-i');
    if (i === null) { return; }
    var n = parseInt(i, 10);
    if (n !== hover) { hover = n; render(); }
  });
  $('chart').addEventListener('mouseleave', function () {
    if (hover !== -1) { hover = -1; render(); }
  });
  render();
})();
</script>
</body>
</html>
