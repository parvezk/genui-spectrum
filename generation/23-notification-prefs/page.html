<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notification preferences</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 16px 84px; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1d1d1f; background: #f5f5f7; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .lead { margin: 0 0 14px; color: #6e6e73; font-size: 13px; }
  .card { background: #fff; border-radius: 14px; padding: 4px 14px; margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11px; font-weight: 600; color: #6e6e73; text-transform: uppercase; letter-spacing: .04em; padding: 10px 0 6px; text-align: center; width: 56px; }
  th:first-child { text-align: left; width: auto; }
  th button { border: 0; background: none; font: inherit; color: inherit; cursor: pointer; text-transform: inherit; letter-spacing: inherit; padding: 0; text-decoration: underline dotted; }
  td { padding: 10px 0; border-top: 1px solid #f0f0f2; text-align: center; vertical-align: middle; }
  td:first-child { text-align: left; }
  td b { display: block; font-weight: 600; }
  td small { color: #6e6e73; font-size: 12px; }
  .sw { position: relative; display: inline-block; width: 40px; height: 24px; cursor: pointer; }
  .sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .sw i { position: absolute; inset: 0; border-radius: 12px; background: #d2d2d7; transition: background .2s; pointer-events: none; }
  .sw i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .2s; }
  .sw input:checked + i { background: #34c759; }
  .sw input:checked + i::after { left: 18px; }
  .sw input:focus-visible + i { outline: 2px solid #0071e3; outline-offset: 2px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; }
  .row + .row, .times, .dayline { border-top: 1px solid #f0f0f2; }
  .times { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 0; }
  .times label { font-size: 12px; color: #6e6e73; display: block; }
  .times input { width: 100%; padding: 7px 8px; border: 1px solid #d2d2d7; border-radius: 8px; font: inherit; margin-top: 3px; }
  .times.off { opacity: .4; }
  .dayline { padding: 12px 0; }
  .track { position: relative; height: 14px; border-radius: 7px; background: #e8f8ec; overflow: hidden; }
  .track i { position: absolute; top: 0; height: 100%; background: #1d1d1f; opacity: .8; }
  .ticks { display: flex; justify-content: space-between; font-size: 10px; color: #6e6e73; margin-top: 3px; }
  .dayline p { margin: 6px 0 0; font-size: 12px; color: #6e6e73; }
  .footer { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.95); border-top: 1px solid #d2d2d7; padding: 10px 16px; display: flex; gap: 10px; align-items: center; }
  .footer span { flex: 1; font-size: 12px; color: #6e6e73; }
  .footer button { border: 0; border-radius: 10px; padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; background: #0071e3; color: #fff; }
  .footer button:disabled { background: #d2d2d7; cursor: default; }
  .footer button.ghost { background: none; color: #0071e3; padding: 9px 4px; }
</style>
</head>
<body>
  <h1>Notifications</h1>
  <p class="lead">Choose how you hear about each kind of activity. Tap a column heading to switch that whole channel on or off.</p>

  <div class="card">
    <table>
      <thead><tr><th>Activity</th><th><button type="button" data-col="email">Email</button></th><th><button type="button" data-col="push">Push</button></th><th><button type="button" data-col="sms">SMS</button></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="card">
    <div class="row"><div><b>Quiet hours</b><br><small style="color:#6e6e73">Hold push and SMS; email is not affected</small></div><label class="sw"><input type="checkbox" id="quiet" aria-label="Quiet hours"><i></i></label></div>
    <div class="times" id="times">
      <label>From<input type="time" id="from"></label>
      <label>To<input type="time" id="to"></label>
    </div>
    <div class="dayline">
      <div class="track" id="track"></div>
      <div class="ticks"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
      <p id="quietText"></p>
    </div>
  </div>

  <div class="footer"><span id="status"></span><button type="button" class="ghost" id="reset">Reset</button><button type="button" id="save">Save</button></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var types = [
    { id: 'mentions', label: 'Mentions', hint: 'Someone @mentions you' },
    { id: 'dms', label: 'Direct messages', hint: 'A new private message' },
    { id: 'digest', label: 'Weekly digest', hint: 'A summary once a week' },
    { id: 'updates', label: 'Product updates', hint: 'New features and news' }
  ];
  var channels = ['email', 'push', 'sms'];
  function defaults() {
    return {
      mentions: { email: true, push: true, sms: false },
      dms: { email: false, push: true, sms: false },
      digest: { email: true, push: false, sms: false },
      updates: { email: true, push: false, sms: false },
      quiet: true, from: '22:00', to: '07:00'
    };
  }
  var prefs = defaults();
  var saved = JSON.stringify(prefs);
  var justSaved = false;

  types.forEach(function (t) {
    var tr = document.createElement('tr');
    var name = document.createElement('td');
    var b = document.createElement('b'); b.textContent = t.label;
    var s = document.createElement('small'); s.textContent = t.hint;
    name.appendChild(b); name.appendChild(s);
    tr.appendChild(name);
    channels.forEach(function (c) {
      var td = document.createElement('td');
      var label = document.createElement('label'); label.className = 'sw';
      var input = document.createElement('input'); input.type = 'checkbox';
      input.setAttribute('data-type', t.id); input.setAttribute('data-channel', c);
      input.setAttribute('aria-label', t.label + ' by ' + c);
      var knob = document.createElement('i');
      label.appendChild(input); label.appendChild(knob);
      td.appendChild(label);
      tr.appendChild(td);
    });
    $('rows').appendChild(tr);
  });

  function minutes(hhmm) {
    var p = hhmm.split(':');
    return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
  }

  function render() {
    var inputs = $('rows').querySelectorAll('input');
    for (var i = 0; i < inputs.length; i++) {
      inputs[i].checked = prefs[inputs[i].getAttribute('data-type')][inputs[i].getAttribute('data-channel')];
    }
    $('quiet').checked = prefs.quiet;
    $('from').value = prefs.from;
    $('to').value = prefs.to;
    $('from').disabled = !prefs.quiet;
    $('to').disabled = !prefs.quiet;
    $('times').className = 'times' + (prefs.quiet ? '' : ' off');

    var track = $('track');
    track.textContent = '';
    var text = 'Quiet hours are off. Push and SMS arrive at any time.';
    if (prefs.quiet && prefs.from && prefs.to) {
      var a = minutes(prefs.from), z = minutes(prefs.to), day = 1440;
      var spans = a === z ? [] : (a < z ? [[a, z]] : [[a, day], [0, z]]);
      spans.forEach(function (sp) {
        var seg = document.createElement('i');
        seg.style.left = (sp[0] / day * 100) + '%';
        seg.style.width = ((sp[1] - sp[0]) / day * 100) + '%';
        track.appendChild(seg);
      });
      var length = a === z ? 0 : (a < z ? z - a : day - a + z);
      var hours = Math.floor(length / 60), mins = length % 60;
      text = 'Quiet from ' + prefs.from + ' to ' + prefs.to + (a > z ? ' the next day' : '') + ': ' + hours + ' h' + (mins ? ' ' + mins + ' min' : '') + ' without push or SMS.';
    }
    $('quietText').textContent = text;

    var dirty = JSON.stringify(prefs) !== saved;
    $('save').disabled = !dirty;
    var on = 0;
    types.forEach(function (t) { channels.forEach(function (c) { if (prefs[t.id][c]) { on += 1; } }); });
    $('status').textContent = dirty ? 'Unsaved changes · ' + on + ' of 12 switches on'
      : (justSaved ? 'Saved on this page. A sandboxed page cannot store or send it.' : on + ' of 12 switches on');
  }

  $('rows').addEventListener('change', function (e) {
    var t = e.target.getAttribute('data-type');
    if (!t) { return; }
    prefs[t][e.target.getAttribute('data-channel')] = e.target.checked;
    justSaved = false;
    render();
  });
  document.querySelector('thead').addEventListener('click', function (e) {
    var c = e.target.getAttribute('data-col');
    if (!c) { return; }
    var allOn = types.every(function (t) { return prefs[t.id][c]; });
    types.forEach(function (t) { prefs[t.id][c] = !allOn; });
    justSaved = false;
    render();
  });
  $('quiet').addEventListener('change', function () { prefs.quiet = $('quiet').checked; justSaved = false; render(); });
  $('from').addEventListener('input', function () { prefs.from = $('from').value; justSaved = false; render(); });
  $('to').addEventListener('input', function () { prefs.to = $('to').value; justSaved = false; render(); });
  $('save').addEventListener('click', function () { saved = JSON.stringify(prefs); justSaved = true; render(); });
  $('reset').addEventListener('click', function () { prefs = defaults(); justSaved = false; render(); });
  render();
})();
</script>
</body>
</html>
