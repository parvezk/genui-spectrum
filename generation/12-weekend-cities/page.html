<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekend city trip</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #2d3142; background: linear-gradient(#eaf4ff, #fff 220px); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .lead { margin: 0 0 12px; color: #5c6178; }
  .card { background: #fff; border: 1px solid #dfe3ee; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .weights { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; }
  .weights .c { color: #2a6f4e; } .weights .w { color: #d9730d; }
  input[type=range] { width: 100%; accent-color: #2d3142; }
  .city { position: relative; background: #fff; border: 2px solid #dfe3ee; border-radius: 12px; padding: 12px; margin-bottom: 10px; transition: border-color .2s, transform .2s; }
  .city.first { border-color: #2a6f4e; }
  .city header { display: flex; justify-content: space-between; align-items: baseline; }
  .city h2 { margin: 0; font-size: 16px; }
  .city .place { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #5c6178; }
  .city.first .place { color: #2a6f4e; }
  .facts { display: flex; gap: 14px; margin: 4px 0 8px; font-size: 13px; }
  .facts b { font-size: 18px; }
  .stack { display: flex; height: 16px; border-radius: 4px; overflow: hidden; background: #f1f3f8; }
  .stack i { display: block; height: 100%; }
  .f1 { background: #4c6ef5; } .f2 { background: #7950f2; } .f3 { background: #e64980; }
  .key { display: flex; gap: 10px; font-size: 11px; color: #5c6178; margin-top: 4px; flex-wrap: wrap; }
  .key i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 3px; }
  .score { display: grid; grid-template-columns: 44px 1fr 34px; gap: 6px; align-items: center; margin-top: 8px; font-size: 12px; font-weight: 700; }
  .meter { height: 8px; background: #f1f3f8; border-radius: 4px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: #2d3142; transition: width .25s; }
  .city.first .meter i { background: #2a6f4e; }
  .verdict { background: #e6f4ec; border-color: #b7dcc6; font-weight: 600; }
  .why { font-size: 12px; color: #5c6178; margin: 0; }
</style>
</head>
<body>
  <h1>A May weekend: Lisbon, Prague or Copenhagen?</h1>
  <p class="lead">Three nights, flights, hotel and food. You said cost matters most, then weather. Move the slider to change that balance.</p>

  <div class="card">
    <div class="weights"><span class="c" id="wCost"></span><span class="w" id="wWeather"></span></div>
    <input id="weight" type="range" min="0" max="100" step="5" value="70" aria-label="How much cost matters compared with weather">
  </div>

  <div class="card verdict" id="verdict"></div>
  <div id="cities"></div>
  <p class="why">Score = cost weight × how cheap (cheapest = 1, dearest = 0) + weather weight × how warm (warmest = 1, coolest = 0).</p>

<script>
(function () {
  var NIGHTS = 3;
  var cities = [
    { name: 'Lisbon', flight: 180, hotel: 120, food: 45, high: 22 },
    { name: 'Prague', flight: 140, hotel: 90, food: 35, high: 19 },
    { name: 'Copenhagen', flight: 210, hotel: 190, food: 70, high: 16 }
  ];
  var $ = function (id) { return document.getElementById(id); };
  var usd = function (n) { return '$' + Math.round(n).toLocaleString('en-US'); };

  cities.forEach(function (c) {
    c.hotelTotal = c.hotel * NIGHTS;
    c.foodTotal = c.food * NIGHTS;
    c.total = c.flight + c.hotelTotal + c.foodTotal;
  });
  var maxTotal = Math.max.apply(null, cities.map(function (c) { return c.total; }));
  var minTotal = Math.min.apply(null, cities.map(function (c) { return c.total; }));
  var maxHigh = Math.max.apply(null, cities.map(function (c) { return c.high; }));
  var minHigh = Math.min.apply(null, cities.map(function (c) { return c.high; }));
  cities.forEach(function (c) {
    c.costScore = (maxTotal - c.total) / (maxTotal - minTotal);
    c.weatherScore = (c.high - minHigh) / (maxHigh - minHigh);
  });

  var box = $('cities');
  cities.forEach(function (c) {
    var el = document.createElement('div'); el.className = 'city';
    var head = document.createElement('header');
    var h = document.createElement('h2'); h.textContent = c.name;
    var place = document.createElement('span'); place.className = 'place';
    head.appendChild(h); head.appendChild(place);

    var facts = document.createElement('div'); facts.className = 'facts';
    var cost = document.createElement('span');
    var costB = document.createElement('b'); costB.textContent = usd(c.total);
    cost.appendChild(costB); cost.appendChild(document.createTextNode(' total'));
    var temp = document.createElement('span');
    var tempB = document.createElement('b'); tempB.textContent = c.high + ' °C';
    temp.appendChild(tempB); temp.appendChild(document.createTextNode(' avg high'));
    facts.appendChild(cost); facts.appendChild(temp);

    var stack = document.createElement('div'); stack.className = 'stack';
    [['f1', c.flight], ['f2', c.hotelTotal], ['f3', c.foodTotal]].forEach(function (part) {
      var seg = document.createElement('i'); seg.className = part[0];
      seg.style.width = (part[1] / maxTotal * 100) + '%';
      stack.appendChild(seg);
    });
    var key = document.createElement('div'); key.className = 'key';
    [['f1', 'Flight ' + usd(c.flight)], ['f2', 'Hotel ' + usd(c.hotelTotal)], ['f3', 'Food ' + usd(c.foodTotal)]].forEach(function (part) {
      var item = document.createElement('span');
      var dot = document.createElement('i'); dot.className = part[0];
      item.appendChild(dot); item.appendChild(document.createTextNode(part[1]));
      key.appendChild(item);
    });

    var score = document.createElement('div'); score.className = 'score';
    var sLabel = document.createElement('span'); sLabel.textContent = 'Score';
    var meter = document.createElement('div'); meter.className = 'meter';
    var fill = document.createElement('i'); meter.appendChild(fill);
    var sNum = document.createElement('span');
    score.appendChild(sLabel); score.appendChild(meter); score.appendChild(sNum);

    [head, facts, stack, key, score].forEach(function (n) { el.appendChild(n); });
    c.el = el; c.place = place; c.fill = fill; c.num = sNum;
  });

  function render() {
    var w = parseInt($('weight').value, 10) / 100;
    $('wCost').textContent = 'Cost ' + Math.round(w * 100) + '%';
    $('wWeather').textContent = 'Weather ' + Math.round((1 - w) * 100) + '%';
    cities.forEach(function (c) { c.score = w * c.costScore + (1 - w) * c.weatherScore; });
    var ranked = cities.slice().sort(function (a, b) { return b.score - a.score; });
    var labels = ['Best match', 'Runner-up', 'Third'];
    ranked.forEach(function (c, i) {
      c.place.textContent = labels[i];
      c.el.className = 'city' + (i === 0 ? ' first' : '');
      c.fill.style.width = (c.score * 100) + '%';
      c.num.textContent = c.score.toFixed(2);
      box.appendChild(c.el);
    });
    var a = ranked[0], b = ranked[1];
    var text = 'Best match: ' + a.name + ' (' + usd(a.total) + ', ' + a.high + ' °C). ';
    if (a.total < b.total) { text += 'It is ' + usd(b.total - a.total) + ' cheaper than ' + b.name + ', which is ' + (b.high - a.high) + ' °C warmer.'; }
    else { text += 'It costs ' + usd(a.total - b.total) + ' more than ' + b.name + ' and is ' + (a.high - b.high) + ' °C warmer.'; }
    $('verdict').textContent = text;
  }

  $('weight').addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
