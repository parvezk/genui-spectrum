<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changing a flat tire</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #111; background: #fffbea; }
  h1 { font-size: 19px; margin: 0 0 8px; }
  h2 { font-size: 15px; margin: 0; }
  .warn { background: #111; color: #ffd400; border-radius: 10px; padding: 10px 12px; font-weight: 600; margin-bottom: 12px; }
  .warn span { color: #fff; font-weight: 400; }
  .top { position: sticky; top: 0; background: #fffbea; padding: 6px 0 8px; z-index: 2; }
  .bar { height: 10px; background: #eadf9f; border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #1a7f37; transition: width .25s; }
  .top small { display: flex; justify-content: space-between; margin-top: 3px; color: #555; }
  .next { background: #fff; border: 2px solid #111; border-radius: 10px; padding: 10px 12px; margin: 8px 0 12px; }
  .next small { display: block; text-transform: uppercase; letter-spacing: .06em; font-size: 10px; color: #555; }
  .next b { display: block; margin: 2px 0 8px; font-size: 16px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 2px solid #111; background: #ffd400; padding: 8px 14px; font-weight: 700; }
  button.ghost { background: #fff; font-weight: 500; border-width: 1px; }
  section { background: #fff; border: 1px solid #e0d48a; border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  section header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #fff3b0; }
  section header span { font-size: 12px; color: #555; }
  label.item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-top: 1px solid #f1eac0; cursor: pointer; }
  label.item input { width: 20px; height: 20px; margin: 1px 0 0; flex: none; accent-color: #1a7f37; }
  label.item.done span { color: #777; text-decoration: line-through; }
  label.item.current { background: #fff9d6; }
  .star { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: center; padding: 12px; }
  .star svg { width: 120px; height: 120px; }
  .nut { fill: #fff; stroke: #111; stroke-width: 2; transition: fill .2s; }
  .nut.on { fill: #ffd400; }
  .nut.past { fill: #1a7f37; }
  .nutLabel { font: 700 11px system-ui, sans-serif; text-anchor: middle; pointer-events: none; }
  #path { fill: none; stroke: #1a7f37; stroke-width: 2; stroke-dasharray: 4 3; }
</style>
</head>
<body>
  <h1>Changing a flat tire</h1>
  <div class="warn">Stay safe first. <span>On a motorway or narrow shoulder, do not change the wheel: get behind the barrier and call for help.</span></div>

  <div class="top">
    <div class="bar"><i id="bar"></i></div>
    <small><span id="count"></span><span id="phase"></span></small>
  </div>

  <div class="next">
    <small id="nextLabel">Next step</small>
    <b id="nextText"></b>
    <button id="doneBtn">Done, next</button>
    <button id="resetBtn" class="ghost">Start over</button>
  </div>

  <div id="sections"></div>

  <section>
    <header><h2>Star pattern for the nuts</h2></header>
    <div class="star">
      <svg viewBox="0 0 120 120" role="img" aria-label="Five wheel nuts tightened in the order 1, 3, 5, 2, 4">
        <circle cx="60" cy="60" r="54" fill="#333"/>
        <circle cx="60" cy="60" r="40" fill="#bbb"/>
        <circle cx="60" cy="60" r="10" fill="#333"/>
        <polyline id="path" points=""/>
        <g id="nuts"></g>
      </svg>
      <div>
        <p style="margin:0 0 8px">Jump to the nut <b>opposite</b>, never the neighbour, so the wheel seats evenly.</p>
        <button id="starBtn" class="ghost">Show the order</button>
        <p id="starText" style="margin:8px 0 0; font-weight:600"></p>
      </div>
    </div>
  </section>

<script>
(function () {
  var sections = [
    { title: '1. Make the scene safe', steps: [
      'Pull over on flat, firm ground, well away from traffic',
      'Hazard lights on; hi-vis vest if you have one',
      'Parking brake on; car in Park or first gear',
      'Passengers out and clear of the road',
      'Warning triangle about 45 m (50 yards) behind the car',
      'Chock the wheel diagonally opposite the flat'
    ] },
    { title: '2. Change the wheel', steps: [
      'Get out the spare, jack and wrench; check the spare has air',
      'Loosen each nut half a turn while the tire is still on the ground',
      'Jack at the jacking point until the tire is 5 cm off the ground',
      'Never put any part of your body under the car',
      'Remove the nuts, keep them together, pull the wheel straight off',
      'Fit the spare and hand-tighten the nuts in a star pattern',
      'Lower until the tire touches, then tighten fully in a star pattern',
      'Lower completely, remove the jack, check each nut again'
    ] },
    { title: '3. Before you drive off', steps: [
      'Stow the flat, jack, wrench, triangle and chock',
      'Check the spare\'s pressure at the next fuel station',
      'Space-saver spare: stay under 80 km/h (50 mph)',
      'Have the nuts re-torqued after about 50 km'
    ] }
  ];
  var $ = function (id) { return document.getElementById(id); };
  var boxes = [];   // { input, label, section, text }
  var root = $('sections');

  sections.forEach(function (sec, s) {
    var el = document.createElement('section');
    var head = document.createElement('header');
    var h = document.createElement('h2');
    h.textContent = sec.title;
    var tally = document.createElement('span');
    head.appendChild(h);
    head.appendChild(tally);
    el.appendChild(head);
    sec.tally = tally;
    sec.steps.forEach(function (text) {
      var label = document.createElement('label');
      label.className = 'item';
      var input = document.createElement('input');
      input.type = 'checkbox';
      var span = document.createElement('span');
      span.textContent = text;
      label.appendChild(input);
      label.appendChild(span);
      el.appendChild(label);
      boxes.push({ input: input, label: label, section: s, text: text });
      input.addEventListener('change', render);
    });
    root.appendChild(el);
  });

  function render() {
    var total = boxes.length;
    var doneCount = 0;
    var firstOpen = -1;
    var perSection = sections.map(function () { return { done: 0, total: 0 }; });
    boxes.forEach(function (b, i) {
      perSection[b.section].total += 1;
      if (b.input.checked) { doneCount += 1; perSection[b.section].done += 1; }
      else if (firstOpen === -1) { firstOpen = i; }
      b.label.classList.toggle('done', b.input.checked);
    });
    boxes.forEach(function (b, i) { b.label.classList.toggle('current', i === firstOpen); });
    sections.forEach(function (sec, s) { sec.tally.textContent = perSection[s].done + ' / ' + perSection[s].total; });

    $('bar').style.width = (doneCount / total * 100) + '%';
    $('count').textContent = doneCount + ' of ' + total + ' steps done';
    if (firstOpen === -1) {
      $('phase').textContent = 'All done';
      $('nextLabel').textContent = 'Finished';
      $('nextText').textContent = 'You are ready to drive. Take it slowly and get the flat repaired.';
      $('doneBtn').disabled = true;
    } else {
      $('phase').textContent = sections[boxes[firstOpen].section].title;
      $('nextLabel').textContent = 'Next step';
      $('nextText').textContent = boxes[firstOpen].text;
      $('doneBtn').disabled = false;
    }
  }

  $('doneBtn').addEventListener('click', function () {
    for (var i = 0; i < boxes.length; i++) {
      if (!boxes[i].input.checked) { boxes[i].input.checked = true; break; }
    }
    render();
  });
  $('resetBtn').addEventListener('click', function () {
    boxes.forEach(function (b) { b.input.checked = false; });
    render();
  });

  // Star pattern: five nuts, tightened 1, 3, 5, 2, 4.
  var SVG = 'http://www.w3.org/2000/svg';
  var order = [0, 2, 4, 1, 3];
  var points = [];
  var nutNodes = [];
  for (var n = 0; n < 5; n++) {
    var angle = (-90 + n * 72) * Math.PI / 180;
    var x = 60 + 28 * Math.cos(angle);
    var y = 60 + 28 * Math.sin(angle);
    points.push([x, y]);
    var c = document.createElementNS(SVG, 'circle');
    c.setAttribute('cx', x.toFixed(1));
    c.setAttribute('cy', y.toFixed(1));
    c.setAttribute('r', '9');
    c.setAttribute('class', 'nut');
    var t = document.createElementNS(SVG, 'text');
    t.setAttribute('x', x.toFixed(1));
    t.setAttribute('y', (y + 4).toFixed(1));
    t.setAttribute('class', 'nutLabel');
    t.textContent = String(n + 1);
    $('nuts').appendChild(c);
    $('nuts').appendChild(t);
    nutNodes.push(c);
  }
  var timer = null;
  function showStar() {
    if (timer) { clearInterval(timer); }
    var k = 0;
    nutNodes.forEach(function (node) { node.setAttribute('class', 'nut'); });
    $('path').setAttribute('points', '');
    $('starText').textContent = '';
    timer = setInterval(function () {
      if (k > 0) { nutNodes[order[k - 1]].setAttribute('class', 'nut past'); }
      if (k === order.length) {
        clearInterval(timer);
        timer = null;
        $('starText').textContent = 'Order: 1 → 3 → 5 → 2 → 4';
        return;
      }
      nutNodes[order[k]].setAttribute('class', 'nut on');
      var pts = order.slice(0, k + 1).map(function (i) { return points[i][0].toFixed(1) + ',' + points[i][1].toFixed(1); }).join(' ');
      $('path').setAttribute('points', pts);
      $('starText').textContent = 'Tighten nut ' + (order[k] + 1);
      k += 1;
    }, 700);
  }
  $('starBtn').addEventListener('click', showStar);

  render();
})();
</script>
</body>
</html>
